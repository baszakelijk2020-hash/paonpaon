name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the e2e job below be started by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_SUMMARY: false

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: `pnpm test` runs validate:completion, which resolves
          # every browser-proof run's gitSha with `git merge-base --is-ancestor`.
          # A shallow clone can't see those ancestor commits and the gate then
          # false-fails every evidence file.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Format check
        run: pnpm format:check

  # Production deploy after green verify on `main`.
  #
  # Why not "git connected deploy-on-push" or Deploy Hooks alone:
  # Vercel Hobby projects can accept hook jobs (`state: PENDING`) and never
  # create a deployment, and GitHub→Vercel push triggers are intermittent
  # (`link.sourceless` on customer/admin). The Deployments API with an
  # explicit `gitSource` is the reliable path — see docs/DEPLOYMENT.md.
  #
  # Requires repo secrets: VERCEL_TOKEN, VERCEL_TEAM_ID.
  # Hobby caps ~100 deployments/day across the account — do not add
  # preview-deploy spam or matrix fan-out beyond these three apps.
  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            project_id: prj_LZi3NMbuRGmmjpX7oWzeFjbFeFHk
          - app: retailer
            project_id: prj_z2yJPrlzEyOBhkStN4cf9fCi1bEg
          - app: admin
            project_id: prj_wdpo4BZUignmmufUovwuEWW4xVMO
    steps:
      - uses: actions/checkout@v5

      - name: Create production deployment from main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          REPO_ID: "1311595139"
        run: bash scripts/vercel-create-production-deploy.sh "${{ matrix.app }}" "${{ matrix.project_id }}"

  # Post-deploy production release gate (ADR pending, 2026-08-22
  # incident). Verifies the three LIVE production domains actually
  # serve their own app — not another app's stale/leaked build — every
  # time main deploys. This is the permanent safety net; do not remove
  # without replacing it with an equivalent check.
  production-gate:
    name: Production release gate
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Run production gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: pnpm test:production

  # Manual-trigger only, deliberately (2026-07-27).
  #
  # This job had never run until CI was first switched on. It fails at
  # `supabase start` with exit code 254 — an infrastructure problem on the
  # runner, not a failure of the application code. The `verify` job above
  # covers lint, typecheck, unit tests, build and format on every push, and
  # that is what protects `main` day to day.
  #
  # It is gated rather than deleted because a permanently red `main` is
  # worse than no CI at all: people stop reading it, and a real failure
  # hides in the noise. Red must keep meaning something.
  #
  # Run it by hand from the Actions tab -> CI -> "Run workflow". Re-enable
  # on every push by restoring `if: github.event_name == 'push'` once the
  # Supabase startup problem is fixed — worth doing before the first paid
  # pilot goes live, not before the first demo.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Build PAON Admin against local Supabase
        run: pnpm --filter @paon/admin build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_RETAILER_APP_URL: http://localhost:3001

      - name: Test PAON Admin journeys
        run: pnpm --filter @paon/admin test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_RETAILER_APP_URL: http://localhost:3001

      - name: Build Retailer Portal against local Supabase
        run: pnpm --filter @paon/retailer build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001

      - name: Test Retailer Portal journeys
        run: pnpm --filter @paon/retailer test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3001

      - name: Build Customer Portal against local Supabase
        run: pnpm --filter @paon/customer build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3002

      - name: Test Customer Portal journeys
        run: pnpm --filter @paon/customer test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3002
