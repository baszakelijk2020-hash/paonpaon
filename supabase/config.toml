# Supabase local development configuration.
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "paon"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3002"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3001",
  "http://localhost:3002",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Uses {{ .RedirectTo }} (set per invite call, e.g.
# `${retailerAppUrl}/auth/confirm`) rather than the fixed
# {{ .SiteURL }} above, since an invite must land on whichever app
# (Admin/Retailer/Customer) the invited role belongs to — see
# docs/DECISIONS.md ADR-012 and apps/retailer/app/auth/confirm/route.ts.
[auth.email.template.invite]
subject = "You've been invited to PAON"
content_path = "./supabase/templates/invite.html"

# Customer Portal login is passwordless (docs/PRODUCT.md) — this is the
# only sign-in path it has. Same {{ .RedirectTo }} reasoning as above;
# set via signInWithOtp's emailRedirectTo
# (apps/customer/app/login/actions.ts).
[auth.email.template.magic_link]
subject = "Sign in to PAON"
content_path = "./supabase/templates/magic-link.html"

[edge_runtime]
enabled = true

[analytics]
enabled = false
